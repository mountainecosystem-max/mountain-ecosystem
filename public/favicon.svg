<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="m-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164E2D"/>
      <stop offset="100%" stop-color="#06180E"/>
    </linearGradient>
    <linearGradient id="peak-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8EFE3"/>
      <stop offset="100%" stop-color="#A5C896"/>
    </linearGradient>
    <linearGradient id="leaf-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A5C896"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="14" fill="url(#m-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#2D6B48" stroke-width="1.2"/>

  <!-- Left/Back Mountain Peak -->
  <path d="M12 48 L25 24 L38 48 Z" fill="#1C5435"/>
  <path d="M25 24 L31 35 L27 34 L25 36 L23 34 L20 35 Z" fill="#91A77B" opacity="0.9"/>

  <!-- Main Central Himalayan Peak -->
  <path d="M22 48 L35 15 L48 48 Z" fill="#0B2516"/>
  <!-- Central Snowcap Crest -->
  <path d="M35 15 L40 28 L37 27 L35 30 L32 27 L29 28 Z" fill="url(#peak-glow)"/>

  <!-- Right Foothill Ridge -->
  <path d="M38 48 L46 32 L54 48 Z" fill="#143D26"/>
  <path d="M46 32 L49 39 L47 38 L46 40 L44 38 L43 39 Z" fill="#8FA777" opacity="0.85"/>

  <!-- Golden/Emerald Horizon Accent Sun/Leaf -->
  <circle cx="35" cy="11.5" r="3.2" fill="url(#leaf-glow)"/>

  <!-- Ground Base Line -->
  <path d="M10 48 Q32 50 54 48" stroke="#34D399" stroke-width="2" stroke-linecap="round"/>
</svg>
